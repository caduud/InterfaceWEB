<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="fundo">
        <form action="#" method="post">
            <h2>Personal Data</h2>
            <div class="linha">
                <div class="campo">
                    <input type="text" name="nome" placeholder="Full Name" required>
                </div>
                <div class="campo">
                    <input type="text" name="cpf" placeholder="CPF" required>
                </div>
            </div>
            <div class="linha">
                <div class="campo">
                    <input type="date" name="nascimento">
                </div>
                <div class="campo">
                    <input type="tel" name="telefone" placeholder="Phone Number">
                </div>
            </div>
            <h2>Address</h2>
            <div class="linha">
                <div class="campo">
                    <input type="text" name="cep" placeholder="ZIP Code (CEP)">
                </div>
                <div class="campo">
                    <input type="text" name="rua" placeholder="Street">
                </div>
            </div>
            <div class="linha">
                <div class="campo">
                    <input type="text" name="bairro" placeholder="Ifalame">
                </div>
                <div class="campo">
                    <input type="text" name="cidade" placeholder="City">
                </div>
            </div>
            <h2>Professional Data</h2>
            <div class="linha">
                <div class="campo">
                    <input type="text" name="empresa" placeholder="Company">
                </div>
                <div class="campo">
                    <input type="text" name="cargo1" placeholder="Job Title">
                </div>
            </div>
            <div class="linha">
                <div class="campo">
                    <input type="text" name="cargo2" placeholder="Job Title">
                </div>
                <div class="campo">
                    <input type="url" name="url" placeholder="Linkedin URL">
                </div>
            </div>
            <input type="submit" value="Create Account">
        </form>
    </div>
</body>
</html>
